<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Manual GC</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a id="fly" href="flight.html">Fly this heap ✈</a>
    <h1 id="title">Waiting for an app to call GC.Collect()</h1>
    <p id="subtitle">Start one with ./play and your app.</p>
    <div id="apps"></div>
    <div id="controls">
      <span id="lives" role="status"></span>
      <span id="timer" role="timer"></span>
      <span id="score" role="status"></span>
      <button id="done" disabled>Done: resume the app</button>
      <label>Eraser <input type="range" id="radius" min="0" max="8" value="0"></label>
      <label>Bytes per block <select id="scale"></select></label>
      <label><input type="checkbox" id="reveal"> Show what is alive (no score)</label>
      <label id="hardcoreLabel" hidden><input type="checkbox" id="hardcore"> Hardcore: crashes the app</label>
    </div>
    <p id="danger" role="alert" hidden>⚠ HARDCORE IS ON. Erasing a live object really frees it. The app will crash or corrupt its data.</p>
    <p id="summary" role="status" hidden></p>
  </header>
  <main>
    <div id="map" tabindex="0" aria-label="Heap map">
      <div id="spacer"></div>
      <canvas id="canvas"></canvas>
      <div id="toast" role="alert" hidden></div>
    </div>
    <aside>
      <h2>Types by size</h2>
      <p class="hint">Click a type to show only its objects.</p>
      <div id="legend"></div>
    </aside>
  </main>
  <div id="tooltip" hidden></div>
  <script src="app.js"></script>
</body>
</html>
